name: Aide iPhone alarm build
on:
  push:
    branches: [aide/iphone-alarm-executor]
    paths: [ios-alarm/**, .github/workflows/aide-iphone-alarm-build.yml]
  pull_request:
    paths: [ios-alarm/**, .github/workflows/aide-iphone-alarm-build.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aide-ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unsigned-build:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate project without external packages
        run: node ios-alarm/generate-project.mjs
      - name: Compile with iOS 26 SDK without signing
        run: |
          set -o pipefail
          xcodebuild -project ios-alarm/AideAlarms.xcodeproj -scheme AideAlarms -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath ios-alarm/build CODE_SIGNING_ALLOWED=NO build 2>&1 | tee ios-alarm/build.log
      - name: Save compiler diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aide-alarm-unsigned-build-log
          path: ios-alarm/build.log
          retention-days: 7
