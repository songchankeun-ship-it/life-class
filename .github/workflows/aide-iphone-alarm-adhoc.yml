name: Aide iPhone direct install (manual approval)
on:
  workflow_dispatch:
    inputs:
      confirm_build:
        description: '등록한 본인 아이폰 1대용 설치 파일을 서명합니다. TestFlight 업로드나 공개 배포는 하지 않습니다.'
        type: boolean
        required: true
        default: false
      recipient_public_key_base64:
        description: 'PC에 보관한 수신용 RSA 공개키 (개인키 입력 금지)'
        type: string
        required: true
permissions:
  contents: read
jobs:
  upload:
    if: inputs.confirm_build && github.ref == 'refs/heads/aide/native-alarm-app'
    environment: aide-testflight
    runs-on: macos-26
    timeout-minutes: 20
    env:
      TEAM_ID: ${{ vars.AIDE_IOS_TEAM_ID }}
      BUNDLE_ID: ${{ vars.AIDE_IOS_BUNDLE_ID }}
      RECIPIENT_PUBLIC_KEY_BASE64: ${{ inputs.recipient_public_key_base64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 81c7db295a1ee468e300797736f98ea71d96bfc8
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare signing material without logging credentials
        env:
          CERTIFICATE_BASE64: ${{ secrets.AIDE_IOS_CERTIFICATE_BASE64 }}
          PROFILE_BASE64: ${{ secrets.AIDE_IOS_ADHOC_PROFILE_BASE64 }}
          WIDGET_PROFILE_BASE64: ${{ secrets.AIDE_IOS_ADHOC_WIDGET_PROFILE_BASE64 }}
        run: |
          python3 - <<'PY'
          import os, re, base64, pathlib, secrets
          for key in ['CERTIFICATE_BASE64','PROFILE_BASE64','WIDGET_PROFILE_BASE64','TEAM_ID','BUNDLE_ID','RECIPIENT_PUBLIC_KEY_BASE64']:
              if not os.environ.get(key): raise SystemExit('Required signing configuration is missing: '+key)
          if not re.fullmatch(r'[A-Z0-9]{10}',os.environ['TEAM_ID']): raise SystemExit('Invalid team ID')
          if not re.fullmatch(r'[\w.-]{5,150}',os.environ['BUNDLE_ID']): raise SystemExit('Invalid bundle ID')
          folder=pathlib.Path(os.environ['RUNNER_TEMP'])
          for name,env in [('aide-signing.p12','CERTIFICATE_BASE64'),('aide-profile.mobileprovision','PROFILE_BASE64'),('aide-widget.mobileprovision','WIDGET_PROFILE_BASE64')]:
              file=folder/name; file.write_bytes(base64.b64decode(os.environ[env])); file.chmod(0o600)
          password=secrets.token_hex(32);print('::add-mask::'+password)
          with open(os.environ['GITHUB_ENV'],'a') as out: out.write('KEYCHAIN_PASSWORD='+password+'\n')
          PY
      - name: Import Apple Distribution certificate and validate provisioning
        env:
          CERTIFICATE_PASSWORD: ${{ secrets.AIDE_IOS_CERTIFICATE_PASSWORD }}
        run: |
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/aide.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/aide.keychain-db"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/aide.keychain-db"
          security import "$RUNNER_TEMP/aide-signing.p12" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$RUNNER_TEMP/aide.keychain-db"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/aide.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/aide.keychain-db"
          security cms -D -i "$RUNNER_TEMP/aide-profile.mobileprovision" > "$RUNNER_TEMP/aide-profile.plist"
          security cms -D -i "$RUNNER_TEMP/aide-widget.mobileprovision" > "$RUNNER_TEMP/aide-widget.plist"
          python3 - <<'PY'
          import os, plistlib, pathlib, shutil, re, datetime
          p=plistlib.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'aide-profile.plist').read_bytes());e=p['Entitlements']
          if e.get('application-identifier') != os.environ['TEAM_ID']+'.'+os.environ['BUNDLE_ID']: raise SystemExit('Profile does not match this exact app and team')
          if e.get('aps-environment') != 'production' or e.get('get-task-allow'): raise SystemExit('A production distribution profile with Push Notifications is required')
          devices=p.get('ProvisionedDevices',[])
          for device in devices: print('::add-mask::'+device)
          if len(devices)!=1 or p.get('ProvisionsAllDevices'): raise SystemExit('Exactly the approved own iPhone is required')
          if p.get('UUID')!='09173e10-1e86-4298-9b67-07bb439ef1a5': raise SystemExit('Use the specifically reviewed own-iPhone app profile')
          uuid=p['UUID']
          if not re.fullmatch(r'[A-Fa-f0-9-]{36}',uuid): raise SystemExit('Invalid profile UUID')
          folder=pathlib.Path.home()/'Library/MobileDevice/Provisioning Profiles';folder.mkdir(parents=True,exist_ok=True)
          shutil.copyfile(pathlib.Path(os.environ['RUNNER_TEMP'])/'aide-profile.mobileprovision',folder/(uuid+'.mobileprovision'))
          with open(os.environ['GITHUB_ENV'],'a') as out: out.write('PROFILE_UUID='+uuid+'\n')
          w=plistlib.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'aide-widget.plist').read_bytes());we=w['Entitlements'];wid=w['UUID']
          if we.get('application-identifier') != os.environ['TEAM_ID']+'.'+os.environ['BUNDLE_ID']+'.widgets' or we.get('get-task-allow') or w.get('ProvisionedDevices')!=devices or w.get('ProvisionsAllDevices'): raise SystemExit('Widget must target the same one own iPhone')
          if w.get('UUID')!='e93a9a84-7b36-4dc5-8d06-4cd78fb16e69': raise SystemExit('Use the specifically reviewed own-iPhone widget profile')
          if not re.fullmatch(r'[A-Fa-f0-9-]{36}',wid): raise SystemExit('Invalid widget profile UUID')
          for profile in [p,w]:
              if profile['ExpirationDate'] <= datetime.datetime.now(datetime.timezone.utc).replace(tzinfo=None): raise SystemExit('Distribution profile has expired')
              if profile.get('TeamIdentifier') != [os.environ['TEAM_ID']]: raise SystemExit('Distribution profile team mismatch')
          shutil.copyfile(pathlib.Path(os.environ['RUNNER_TEMP'])/'aide-widget.mobileprovision',folder/(wid+'.mobileprovision'))
          with open(os.environ['GITHUB_ENV'],'a') as out: out.write('WIDGET_PROFILE_UUID='+wid+'\n')
          options={'method':'release-testing','teamID':os.environ['TEAM_ID'],'signingStyle':'manual','provisioningProfiles':{os.environ['BUNDLE_ID']:uuid,os.environ['BUNDLE_ID']+'.widgets':wid},'uploadSymbols':False,'manageAppVersionAndBuildNumber':False}
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'aide-export.plist').write_bytes(plistlib.dumps(options))
          PY
      - name: Archive and export signed app
        run: |
          node ios-alarm/generate-project.mjs
          /usr/libexec/PlistBuddy -c 'Set :aps-environment production' ios-alarm/AideAlarms.entitlements
          xcodebuild -project ios-alarm/AideAlarms.xcodeproj -scheme AideAlarms -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -archivePath ios-alarm/build/AideAlarms.xcarchive DEVELOPMENT_TEAM="$TEAM_ID" AIDE_BUNDLE_ID="$BUNDLE_ID" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY='Apple Distribution' AIDE_APP_PROFILE="$PROFILE_UUID" AIDE_WIDGET_PROFILE="$WIDGET_PROFILE_UUID" archive
          xcodebuild -exportArchive -archivePath ios-alarm/build/AideAlarms.xcarchive -exportPath ios-alarm/build/export -exportOptionsPlist "$RUNNER_TEMP/aide-export.plist"
      - name: Verify app and embedded widget signatures before upload
        run: |
          APP='ios-alarm/build/AideAlarms.xcarchive/Products/Applications/AideAlarms.app'
          python3 ios-alarm/verify-release-bundle.py "$APP" --version 0.2.0
          codesign --verify --deep --strict "$APP"
          codesign -d --entitlements :- "$APP" > "$RUNNER_TEMP/aide-signed-entitlements.plist" 2>/dev/null
          python3 - <<'PY'
          import os, plistlib, pathlib
          app=pathlib.Path('ios-alarm/build/AideAlarms.xcarchive/Products/Applications/AideAlarms.app')
          info=plistlib.loads((app/'Info.plist').read_bytes())
          entitlement=plistlib.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'aide-signed-entitlements.plist').read_bytes())
          if info['CFBundleIdentifier'] != os.environ['BUNDLE_ID']: raise SystemExit('Signed app bundle ID mismatch')
          if entitlement.get('aps-environment') != 'production' or entitlement.get('get-task-allow',False): raise SystemExit('Invalid signed distribution entitlements')
          widgets=list((app/'PlugIns').glob('*.appex'))
          if len(widgets) != 1: raise SystemExit('Expected one embedded alarm widget')
          widget=plistlib.loads((widgets[0]/'Info.plist').read_bytes())
          if widget['CFBundleIdentifier'] != os.environ['BUNDLE_ID']+'.widgets': raise SystemExit('Signed widget bundle ID mismatch')
          if widget['CFBundleVersion'] != info['CFBundleVersion']: raise SystemExit('App and widget build versions differ')
          if info['CFBundleVersion'] != os.environ['GITHUB_RUN_NUMBER']: raise SystemExit('Unexpected candidate build number')
          print('Verified signed app, production push entitlement and embedded alarm widget')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as summary: summary.write('Aide '+info['CFBundleShortVersionString']+' build '+info['CFBundleVersion']+'; source ''81c7db295a1ee468e300797736f98ea71d96bfc8'+'; app/widget signatures and privacy resources checked. No App Store upload.\n')
          PY
      - name: Verify exported IPA contains exactly the reviewed profiles
        run: |
          python3 - <<'PY'
          import pathlib,plistlib,subprocess,zipfile
          app_expected=plistlib.loads((pathlib.Path(__import__('os').environ['RUNNER_TEMP'])/'aide-profile.plist').read_bytes())
          with zipfile.ZipFile('ios-alarm/build/export/AideAlarms.ipa') as z:
              names=[name for name in z.namelist() if name.endswith('/embedded.mobileprovision')]
              if len(names)!=2: raise SystemExit('Expected app and widget profiles only')
              expected={'09173e10-1e86-4298-9b67-07bb439ef1a5','e93a9a84-7b36-4dc5-8d06-4cd78fb16e69'}
              actual=set()
              for name in names:
                  decoded=subprocess.run(['security','cms','-D'],input=z.read(name),capture_output=True,check=True).stdout
                  p=plistlib.loads(decoded)
                  if p.get('ProvisionedDevices')!=app_expected['ProvisionedDevices']: raise SystemExit('Exported device set mismatch')
                  actual.add(p['UUID'])
              if actual!=expected: raise SystemExit('Exported profile identity mismatch')
          print('Exported IPA has exactly the two approved own-device profiles')
          PY
      - name: Encrypt IPA before artifact upload
        run: |
          node --input-type=module - <<'NODE'
          // Local/CI artifact transport only. Never uploads an IPA or private key.
          import {createReadStream, createWriteStream} from 'node:fs';
          import {open, readFile, stat, unlink} from 'node:fs/promises';
          import {pipeline, finished} from 'node:stream/promises';
          import {createCipheriv, createDecipheriv, createPublicKey, publicEncrypt, privateDecrypt, randomBytes, constants} from 'node:crypto';
          
          const magic = Buffer.from('AIDEIPA1');
          const padding = constants.RSA_PKCS1_OAEP_PADDING;
          
          export async function encryptIpa(inputPath, outputPath, recipientPem) {
            const recipient = createPublicKey(recipientPem);
            if (recipient.asymmetricKeyType !== 'rsa' || recipient.asymmetricKeyDetails.modulusLength < 3072) throw new Error('RSA_3072_REQUIRED');
            const key = randomBytes(32), iv = randomBytes(12);
            const header = Buffer.from(JSON.stringify({algorithm:'RSA-OAEP-SHA256+AES-256-GCM', key:publicEncrypt({key:recipient,padding,oaepHash:'sha256'},key).toString('base64'), iv:iv.toString('base64')}));
            const length = Buffer.alloc(4); length.writeUInt32BE(header.length);
            const prefix = Buffer.concat([magic,length,header]);
            // Exclusive creation: never replace an existing export or user's file.
            const file = await open(outputPath,'wx',0o600);
            const output = file.createWriteStream({autoClose:true});
            try {
              const cipher = createCipheriv('aes-256-gcm',key,iv);
              cipher.setAAD(prefix);
              output.write(prefix);
              await pipeline(createReadStream(inputPath),cipher,output,{end:false});
              output.end(cipher.getAuthTag());
              await finished(output);
            } catch (error) {
              output.destroy(); await file.close().catch(()=>{});
              await unlink(outputPath).catch(()=>{});
              throw error;
            } finally { key.fill(0); }
          }
          
          export async function decryptIpa(inputPath, outputPath, recipientPrivatePem) {
            const size = (await stat(inputPath)).size;
            const handle = await open(inputPath,'r');
            let header, prefix, authTag;
            try {
              const start = Buffer.alloc(12);
              if ((await handle.read(start,0,12,0)).bytesRead !== 12 || !start.subarray(0,8).equals(magic)) throw new Error('INVALID_ENVELOPE');
              const length = start.readUInt32BE(8);
              if (length < 32 || length > 4096 || size <= 12+length+16) throw new Error('INVALID_ENVELOPE_LENGTH');
              const body = Buffer.alloc(length);
              if ((await handle.read(body,0,length,12)).bytesRead !== length) throw new Error('TRUNCATED_ENVELOPE');
              prefix = Buffer.concat([start,body]); header = JSON.parse(body);
              if (header.algorithm !== 'RSA-OAEP-SHA256+AES-256-GCM') throw new Error('INVALID_ALGORITHM');
              authTag = Buffer.alloc(16); await handle.read(authTag,0,16,size-16);
            } finally { await handle.close(); }
            const key = privateDecrypt({key:recipientPrivatePem,padding,oaepHash:'sha256'},Buffer.from(header.key,'base64'));
            const iv = Buffer.from(header.iv,'base64');
            if (key.length !== 32 || iv.length !== 12) throw new Error('INVALID_KEY_MATERIAL');
            const outputHandle = await open(outputPath,'wx',0o600);
            const output = outputHandle.createWriteStream({autoClose:true});
            try {
              const decipher = createDecipheriv('aes-256-gcm',key,iv);
              decipher.setAAD(prefix); decipher.setAuthTag(authTag);
              await pipeline(createReadStream(inputPath,{start:prefix.length,end:size-17}),decipher,output);
            } catch (error) {
              output.destroy(); await outputHandle.close().catch(()=>{});
              await unlink(outputPath).catch(()=>{});
              throw error;
            } finally { key.fill(0); }
          }
          
          
          await encryptIpa('ios-alarm/build/export/AideAlarms.ipa','ios-alarm/build/AideAlarms.ipa.aide-encrypted', Buffer.from(process.env.RECIPIENT_PUBLIC_KEY_BASE64,'base64').toString('utf8'));
          console.log('Created encrypted own-device IPA artifact; no raw IPA uploaded.');
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: aide-own-iphone-encrypted
          path: ios-alarm/build/AideAlarms.ipa.aide-encrypted
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Remove signing material from ephemeral runner
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/aide.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/aide-signing.p12" "$RUNNER_TEMP/aide-profile.mobileprovision" "$RUNNER_TEMP/aide-profile.plist" "$RUNNER_TEMP/aide-widget.mobileprovision" "$RUNNER_TEMP/aide-widget.plist" "$RUNNER_TEMP/aide-export.plist" "$RUNNER_TEMP/aide-signed-entitlements.plist"
          if [ -n "$PROFILE_UUID" ]; then rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"; fi
          if [ -n "$WIDGET_PROFILE_UUID" ]; then rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$WIDGET_PROFILE_UUID.mobileprovision"; fi
          rm -f ios-alarm/build/export/AideAlarms.ipa
