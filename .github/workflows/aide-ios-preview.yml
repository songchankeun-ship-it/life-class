name: Aide iPhone screens (no signing or alarms)
on:
  push:
    branches: [aide/ios-screen-preview]
    paths: [ios-alarm/**, .github/workflows/aide-ios-preview.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  iphone-screens:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare disposable read-only screen fixture
        run: |
          node ios-alarm/preview/prepare.mjs
          node ios-alarm/generate-project.mjs
          node ios-alarm/preview/server.mjs > "$RUNNER_TEMP/aide-preview-server.log" 2>&1 &
      - name: Compile unsigned simulator UI
        run: |
          if ! xcodebuild -project ios-alarm/AideAlarms.xcodeproj -scheme AideAlarms -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath ios-alarm/build CODE_SIGNING_ALLOWED=NO build > "$RUNNER_TEMP/aide-preview-build.log" 2>&1; then
            tail -n 100 "$RUNNER_TEMP/aide-preview-build.log"
            exit 1
          fi
      - name: Capture current app screens with no device connection
        run: |
          python3 - <<'PY'
          import json, subprocess, os, pathlib
          data=json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','--json']))
          phones=[p for runtime,devices in data['devices'].items() if 'iOS-26' in runtime for p in devices if p['name'].startswith('iPhone')]
          if not phones: raise SystemExit('No iOS 26 iPhone simulator available')
          phone=next((p for p in phones if p['name']=='iPhone 17 Pro'),phones[0])
          with open(os.environ['GITHUB_ENV'],'a') as f: f.write('AIDE_PREVIEW_SIM='+phone['udid']+'\n')
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'aide-preview-sim.txt').write_text(phone['udid'])
          print('Preview simulator: '+phone['name'])
          subprocess.run(['xcrun','simctl','boot',phone['udid']],check=False)
          subprocess.run(['xcrun','simctl','bootstatus',phone['udid'],'-b'],check=True)
          PY
          AIDE_PREVIEW_SIM="$(cat "$RUNNER_TEMP/aide-preview-sim.txt")"
          xcrun simctl ui "$AIDE_PREVIEW_SIM" appearance light
          xcrun simctl status_bar "$AIDE_PREVIEW_SIM" override --time '9:41' --dataNetwork wifi --wifiMode active --wifiBars 3 --batteryState charged --batteryLevel 100
          xcrun simctl install "$AIDE_PREVIEW_SIM" ios-alarm/build/Build/Products/Debug-iphonesimulator/AideAlarms.app
          xcrun simctl launch "$AIDE_PREVIEW_SIM" com.aide.personal.alarms --aide-preview-onboarding -AppleLanguages '(ko)' -AppleLocale ko_KR
          sleep 6
          xcrun simctl io "$AIDE_PREVIEW_SIM" screenshot "$RUNNER_TEMP/aide-connect.png"
          for screen in device permission ready; do
            xcrun simctl terminate "$AIDE_PREVIEW_SIM" com.aide.personal.alarms
            xcrun simctl launch "$AIDE_PREVIEW_SIM" com.aide.personal.alarms "--aide-preview-$screen" -AppleLanguages '(ko)' -AppleLocale ko_KR
            sleep 3
            xcrun simctl io "$AIDE_PREVIEW_SIM" screenshot "$RUNNER_TEMP/aide-$screen.png"
          done
          xcrun simctl terminate "$AIDE_PREVIEW_SIM" com.aide.personal.alarms
          xcrun simctl launch "$AIDE_PREVIEW_SIM" com.aide.personal.alarms --aide-preview-alarm -AppleLanguages '(ko)' -AppleLocale ko_KR
          sleep 9
          xcrun simctl io "$AIDE_PREVIEW_SIM" screenshot "$RUNNER_TEMP/aide-weekday.png"
      - name: Return screen pixels in diagnostics without artifact storage
        run: |
          python3 - <<'PY'
          import os, pathlib, base64
          folder=pathlib.Path(os.environ['RUNNER_TEMP'])
          for name in ['aide-connect','aide-device','aide-permission','aide-ready','aide-weekday']:
              data=(folder/(name+'.png')).read_bytes()
              print('AIDE_PREVIEW_BEGIN '+name)
              print(base64.b64encode(data).decode())
              print('AIDE_PREVIEW_END '+name)
          PY
      - name: Stop preview simulator
        if: always()
        run: |
          if [ -n "$AIDE_PREVIEW_SIM" ]; then xcrun simctl shutdown "$AIDE_PREVIEW_SIM" || true; fi
